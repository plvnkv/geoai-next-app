name: geoai-app

services:
  app:
    container_name: app
    image: geoai-app:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    models:
      - llm

models:
  llm:
    model: docker.io/ai/qwen3.5:9B-UD-Q4_K_XL
